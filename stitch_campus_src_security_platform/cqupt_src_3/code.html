<body class="bg-inverse-surface min-h-screen flex items-center justify-center p-md relative overflow-hidden">
<!-- Abstract Background Pattern -->
<div class="absolute inset-0 z-0 opacity-20 pointer-events-none">
<svg class="w-full h-full" xmlns="http://www.w3.org/2000/svg">
<defs>
<pattern height="40" id="grid" patternunits="userSpaceOnUse" width="40">
<path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"></path>
</pattern>
</defs>
<rect fill="url(#grid)" height="100%" width="100%"></rect>
</svg>
</div>
<!-- Glowing Orbs -->
<div class="absolute top-1/4 left-1/4 w-64 h-64 bg-primary-container rounded-full mix-blend-screen filter blur-[100px] opacity-20 animate-pulse pointer-events-none"></div>
<div class="absolute bottom-1/4 right-1/4 w-96 h-96 bg-primary-fixed rounded-full mix-blend-screen filter blur-[120px] opacity-10 pointer-events-none"></div>
<!-- Registration Card -->
<div class="w-full max-w-[500px] bg-inverse-surface/80 backdrop-blur-[20px] border border-white/10 rounded-xl shadow-[0_4px_24px_-1px_rgba(0,0,0,0.5)] p-lg relative z-10">
<!-- Header -->
<div class="text-center mb-lg">
<div class="flex flex-col items-center justify-center mb-sm">
<img alt="CQUPT-SRC Logo" class="h-[64px] w-auto mb-base opacity-90" src="https://lh3.googleusercontent.com/aida/ADBb0uhJz5xKGQgPFUjzBTqxmu3nMCDDtgbSKTxH39o-GlgpxRQsvGRkVtXs-BqRZO12xLF-7Mh9ovkdUydp1pARmS5fa2Ua3ujaQks_HY8DQi3qWZnOudr4OiZs4R_TmWG1510aDH1BgFr__NAAtE-Uo8KpJrT5hgRFAy-wUSWnnAY7sriIWI8yP1sOv__CauT3wo5Tng1EjD9ab5nb4TvLbCiWUND4UxMkf6oqFk14B4FYr8FVpGxLQzdDVMr78bSHYXpyXdzr3CKvLg"/>
<h1 class="font-h1 text-h1 text-white tracking-tight">注册</h1>
<p class="font-body-md text-body-md text-white/50 mt-xs">CQUPT Security Response Center</p></div>
</div>
<!-- Form -->
<form class="space-y-md">
<!-- Username -->
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-surface-variant" style="font-variation-settings: 'FILL' 0;">person</span>
</div>
<input class="w-full border border-white/10 py-sm pl-[40px] pr-sm text-on-primary font-body-md text-body-md focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all placeholder-surface-variant/50 rounded-xl bg-white/5" placeholder="用户名" type="text"/>
</div>
<!-- Auth Code -->
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-surface-variant" style="font-variation-settings: 'FILL' 0;">badge</span>
</div>
<input class="w-full border border-white/10 py-sm pl-[40px] pr-sm text-on-primary font-body-md text-body-md focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all placeholder-surface-variant/50 rounded-xl bg-white/5" placeholder="统一认证码" type="text"/>
</div>
<!-- Identity Type -->
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none z-10">
<span class="material-symbols-outlined text-surface-variant" style="font-variation-settings: 'FILL' 0;">school</span>
</div>
<select class="w-full border border-white/10 py-sm pl-[40px] pr-sm text-on-primary font-body-md text-body-md focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all appearance-none cursor-pointer rounded-xl bg-white/5">
<option class="text-surface-variant/50" disabled="" selected="" value="">身份类型</option>
<option class="bg-inverse-surface text-on-primary" value="本科生">本科生</option>
<option class="bg-inverse-surface text-on-primary" value="研究生">研究生</option>
<option class="bg-inverse-surface text-on-primary" value="教师">教师</option>
<option class="bg-inverse-surface text-on-primary" value="信息化办老师">信息化办老师</option>
<option class="bg-inverse-surface text-on-primary" value="社团/工作室成员">社团/工作室成员</option>
<option class="bg-inverse-surface text-on-primary" value="校外访客">校外访客</option>
</select>
<div class="absolute inset-y-0 right-0 pr-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-surface-variant" style="font-variation-settings: 'FILL' 0;">expand_more</span>
</div>
</div>
<!-- Email -->
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-surface-variant" style="font-variation-settings: 'FILL' 0;">mail</span>
</div>
<input class="w-full border border-white/10 py-sm pl-[40px] pr-sm text-on-primary font-body-md text-body-md focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all placeholder-surface-variant/50 rounded-xl bg-white/5" placeholder="邮箱" type="email"/>
</div>
<!-- Verification Code -->
<div class="flex gap-sm">
<div class="relative flex-1">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-surface-variant" style="font-variation-settings: 'FILL' 0;">mark_email_read</span>
</div>
<input class="w-full border border-white/10 py-sm pl-[40px] pr-sm text-on-primary font-body-md text-body-md focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all placeholder-surface-variant/50 rounded-xl bg-white/5" placeholder="邮箱验证码" type="text"/>
</div>
<button class="bg-white/5 hover:bg-white/10 border border-white/10 text-on-primary font-label-sm text-label-sm rounded-xl px-md transition-colors whitespace-nowrap" type="button">
                    获取验证码
                </button>
</div>
<!-- Password -->
<div>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-surface-variant" style="font-variation-settings: 'FILL' 0;">lock</span>
</div>
<input class="w-full border border-white/10 py-sm pl-[40px] pr-[40px] text-on-primary font-body-md text-body-md focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all placeholder-surface-variant/50 rounded-xl bg-white/5" placeholder="密码" type="password"/>
<button class="absolute inset-y-0 right-0 pr-sm flex items-center text-surface-variant hover:text-on-primary transition-colors" type="button">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">visibility_off</span>
</button>
</div>
<p class="font-label-sm text-label-sm text-surface-variant mt-xs pl-xs">长度至少8位，需包含数字、字母及符号中至少两种组合</p>
</div>
<!-- Confirm Password -->
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-sm flex items-center pointer-events-none">
<span class="material-symbols-outlined text-surface-variant" style="font-variation-settings: 'FILL' 0;">lock_clock</span>
</div>
<input class="w-full border border-white/10 py-sm pl-[40px] pr-[40px] text-on-primary font-body-md text-body-md focus:outline-none focus:border-primary-container focus:ring-1 focus:ring-primary-container transition-all placeholder-surface-variant/50 rounded-xl bg-white/5" placeholder="确认密码" type="password"/>
</div>
<!-- Action -->
<!-- Captcha Slider -->
<div class="relative w-full h-[40px] bg-white/5 border border-white/10 overflow-hidden flex items-center group cursor-pointer mt-xs rounded-xl">
<div class="absolute left-0 top-0 bottom-0 w-[40px] bg-primary-container border-r border-white/20 flex items-center justify-center z-10 hover:brightness-110 transition-all rounded-l-xl">
<span class="material-symbols-outlined text-white text-[20px]">keyboard_double_arrow_right</span>
</div>
<div class="w-full text-center font-label-sm text-label-sm text-white/40 select-none">向右滑动完成验证</div>
<div class="absolute inset-0 bg-primary-container/10 w-0 transition-all duration-300"></div>
</div>
<!-- Agreements -->
<div class="space-y-base pt-xs">
<label class="flex items-start gap-sm cursor-pointer group">
<input class="mt-1 w-4 h-4 bg-white/5 border-white/10 rounded-sm text-primary-container focus:ring-primary-container focus:ring-offset-0 focus:ring-offset-transparent transition-all cursor-pointer" type="checkbox"/>
<span class="font-label-sm text-label-sm text-white/60 group-hover:text-white/80 transition-colors">
                        同意<a class="text-primary-container hover:underline" href="#">用户协议</a>
</span>
</label>
<label class="flex items-start gap-sm cursor-pointer group">
<input class="mt-1 w-4 h-4 bg-white/5 border-white/10 rounded-sm text-primary-container focus:ring-primary-container focus:ring-offset-0 focus:ring-offset-transparent transition-all cursor-pointer" type="checkbox"/>
<span class="font-label-sm text-label-sm text-white/60 group-hover:text-white/80 transition-colors">
                        同意<a class="text-primary-container hover:underline" href="#">隐私政策</a>
</span>
</label>
<label class="flex items-start gap-sm cursor-pointer group">
<input class="mt-1 w-4 h-4 bg-white/5 border-white/10 rounded-sm text-primary-container focus:ring-primary-container focus:ring-offset-0 focus:ring-offset-transparent transition-all cursor-pointer" type="checkbox"/>
<span class="font-label-sm text-label-sm text-white/60 group-hover:text-white/80 transition-colors">
                        确认仅在授权范围内进行安全测试
                    </span>
</label>
</div>
<button class="w-full bg-primary-container hover:brightness-110 text-white font-label-sm text-label-sm py-sm transition-all flex items-center justify-center mt-sm rounded-xl" type="submit">
                立即注册
                <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</form>
<!-- Footer -->
<div class="mt-sm pt-md border-t border-white/5 text-center">
<a class="font-label-sm text-label-sm text-surface-variant hover:text-primary-container transition-colors inline-flex items-center gap-xs" href="#">
                已有账号？立即登录
            </a>
</div>
</div>
</body></html>
