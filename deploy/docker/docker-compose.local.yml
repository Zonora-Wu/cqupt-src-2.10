name: cqupt-src-local

services:
  postgres:
    image: postgres:16-alpine
    container_name: cqupt-src-local-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: cqupt_src
      POSTGRES_USER: cqupt_src
      POSTGRES_PASSWORD: cqupt_src_password
      TZ: Asia/Shanghai
    ports:
      - "15432:5432"
    volumes:
      - cqupt_src_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cqupt_src -d cqupt_src"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cqupt-src-local-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - cqupt_src_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    container_name: cqupt-src-local-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
      TZ: Asia/Shanghai
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - cqupt_src_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  cqupt_src_postgres_data:
  cqupt_src_redis_data:
  cqupt_src_minio_data:
